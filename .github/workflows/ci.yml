name: CI & BPMN Conformance Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies (Cairo & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libxml2-dev libxslt1-dev fonts-liberation

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Reference Templates
        run: |
          for f in assets/templates/*.bpmn; do
            echo "Validating $f..."
            python scripts/bpmn.py validate "$f" --soundness
          done

      - name: Test Normalization & Render Pipeline
        run: |
          mkdir -p output_test
          python scripts/bpmn.py render assets/templates/minimal-process.bpmn -o output_test/minimal --formats png,svg,bpmn --soundness
          python scripts/bpmn.py render assets/templates/collaboration-lanes-messages.bpmn -o output_test/collab --formats png,svg,bpmn --soundness
